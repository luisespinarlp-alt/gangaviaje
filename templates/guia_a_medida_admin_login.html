<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Guía a Medida</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0F1F1E; color: #222; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { background: white; border-radius: 16px; padding: 36px; max-width: 340px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  h1 { font-size: 1.15rem; margin: 0 0 6px; }
  p { font-size: .82rem; color: #888; margin: 0 0 20px; }
  input[type=password] { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e4ea; border-radius: 10px; font-size: .9rem; margin-bottom: 14px; }
  button { width: 100%; background: #2E9E8F; color: white; border: none; padding: 13px; border-radius: 10px; font-size: .92rem; font-weight: 800; cursor: pointer; }
  button:hover { background: #248073; }
  .error { color: #c0392b; font-size: .82rem; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Guía a Medida</h1>
    <p>Panel de solicitudes — acceso restringido.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Contraseña" autofocus required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
